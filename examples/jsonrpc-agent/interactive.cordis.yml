            input: [ text ]
          - id: qwen3.8-max
            name: Qwen3.8 Max
            contextWindow: 262144
            maxTokens: 65536
            input: [ text ]
          - id: qwen3.7-max
            name: Qwen3.7 Max
            contextWindow: 262144
            maxTokens: 65536
            input: [ text ]
          - id: qwen3.7-plus
            name: Qwen3.7 Plus
            contextWindow: 262144
