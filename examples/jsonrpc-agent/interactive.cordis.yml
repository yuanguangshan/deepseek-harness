            maxTokens: 131072
            input: [ text, image ]
      # 小米 MiMo 独立 route（通过 opencode 渠道）
      xiaomi:
        displayName: xiaomi
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: mimo-v2.5
            name: MiMo V2.5
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
      # meta route（Muse Spark 独立 route，通过 opencode 渠道）
      meta:
        displayName: meta
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: muse-spark-1.2
            name: Muse Spark 1.2
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
          - id: muse-spark-1.2-contributor
            name: Muse Spark 1.2 Contributor
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
      # 智谱 GLM Coding Plan 独立 route（key 放根目录 .env）
      zhipu:
        displayName: zhipu coding-plan
        apiKeyEnv: ZHIPU_CODING_API_KEY
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        models:
          - id: glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 200000
            maxTokens: 65536
            input: [ text ]
      # cc-switch 本地代理 route（CC Switch.app 常驻 127.0.0.1:15721，本地不校验 key，
      # 上游由 cc-switch GUI 按协议渠道路由：anthropic 端点→claude 渠道，openai 端点→codex 渠道）
      ccswitch:
        displayName: cc-switch
        apiKeyEnv: CCSWITCH_API_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:15721
        models:
          - id: glm-5.3-flash
            name: GLM 5.3 Flash (cc-switch)
            contextWindow: 200000
            maxTokens: 65536
