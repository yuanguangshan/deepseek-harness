            maxTokens: 384000
            input: [ text ]
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
          - id: kimi-k3
            name: Kimi K3
            contextWindow: 256000
            maxTokens: 65536
            input: [ text ]
          - id: kimi-k2.7-code
            name: Kimi K2.7 Code
            contextWindow: 256000
            maxTokens: 65536
            input: [ text ]
          - id: kimi-k2.6
            name: Kimi K2.6
            contextWindow: 256000
            maxTokens: 65536
            input: [ text ]
          - id: kimi-k2.5
            name: Kimi K2.5
            contextWindow: 256000
            maxTokens: 65536
            input: [ text ]
          - id: glm-5.2
            name: GLM 5.2
            contextWindow: 200000
            maxTokens: 65536
            input: [ text ]
          - id: glm-5.1
            name: GLM 5.1
            contextWindow: 200000
            maxTokens: 65536
            input: [ text ]
          - id: glm-5
