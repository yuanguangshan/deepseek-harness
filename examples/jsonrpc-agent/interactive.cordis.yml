      # 腾讯混元 route（与 dsh web 的 ~/.dsh/settings.yaml llm-pi-ai.providers.tencent 对齐）：
      # 走本地 wb-proxy（127.0.0.1:8487，~/bin/wb-proxy，上游 copilot.tencent.com，仅 stream）。
