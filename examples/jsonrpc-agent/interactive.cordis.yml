# Unattended coding-agent deployment for the bundled dsh-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

# User settings ($DSH_HOME/settings.yaml) and credential store: provide the
# llm-pi-ai provider routes (opencode-go) and per-request API keys.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# DeepSeek adapter via llm-pi-ai (opencode-go route, 显式声明).
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        displayName: opencode-go
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-responses
        baseURL: https://opencode.ai/zen/go/v1
        models:
          # DeepSeek 官方模型（opencode-go 渠道代理）
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
          # responses 接口兼容子集（其余模型走 opencode-go-completions route）
          - id: grok-4.5
            name: Grok 4.5
            contextWindow: 256000
            maxTokens: 65536
            input: [ text ]
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            contextWindow: 272000
            maxTokens: 128000
            input: [ text ]
          - id: muse-spark-1.2
            name: Muse Spark 1.2
            contextWindow: 1000000
            maxTokens: 384000
            input: [ text ]
      opencode-go-completions:
        displayName: opencode-go (completions)
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        models:
