            contextWindow: 200000
            maxTokens: 65536
            input: [ text ]
          - id: minimax-m3
            name: MiniMax M3
            contextWindow: 1000000
            maxTokens: 128000
            input: [ text ]
          - id: minimax-m2.7
            name: MiniMax M2.7
            contextWindow: 204800
            maxTokens: 131072
            input: [ text ]
          - id: minimax-m2.5
            name: MiniMax M2.5
