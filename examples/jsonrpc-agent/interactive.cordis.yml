# 服务端斜杠命令（/compact /feedback /goal /export）
- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: command-compact
  name: '@deepseek-ai/dsh-command-compact'

- id: command-feedback
  name: '@deepseek-ai/dsh-command-feedback'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: session-log-export
  name: '@deepseek-ai/dsh-session-log-export'

# dsh-web / TUI 界面控制命令（webctl）：/web-* 与 /tui-*（启停/状态/无缝切换）。
# 插件本体在 web profile（~/.dsh/profiles/web/webctl.plugin.mjs），web 与 TUI 共用
# 同一份（TUI 侧经同目录软链 webctl.plugin.mjs 引用，保持单点维护），真正的
# 启停/切换交给外部守护脚本 ~/bin/dsh-web.sh（nohup / tmux）。
# 注意：name 必须是相对路径（loader 以 baseUrl 解析 ./），写绝对路径在 TUI
# runtime（internal import）里不会加载。
- id: webctl
  name: ./webctl.plugin.mjs

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    goals: {}
    skills:
      enabled: true
      filesystem:
        customSkillDirs:
          - !!js process.env.HOME + '/.pi/agent/skills'
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
